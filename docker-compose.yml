services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/water.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload